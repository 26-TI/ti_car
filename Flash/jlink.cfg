# OpenOCD：SEGGER J-Link 探针（libjaylink）+ SWD + MSPM0 目标
# 仅作备用：MSPM0 直接用 SEGGER JLinkExe 更稳（见 Flash/JLink_flash.sh）
# 使用前确认当前 OpenOCD 带 jlink 适配器：
#   openocd -c "adapter list" -c "shutdown"
adapter driver jlink
adapter speed 4000

transport select swd

set _mspm0_target [file join [file dirname [info script]] mspm0.cfg]
if { ![file exists $_mspm0_target] } {
    echo "ERROR: 找不到 $_mspm0_target"
    shutdown
}
source $_mspm0_target
