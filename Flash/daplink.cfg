# OpenOCD：CMSIS-DAP 探针 + SWD + MSPM0 目标
#
# 说明：target 配置随工程附带（Flash/mspm0.cfg），不再依赖 OpenOCD 发行版是否
#       自带 target/ti/mspm0.cfg —— Ubuntu 源里的 0.12.0 就没有这个文件，
#       也没有 mspm0 flash 驱动，请用 Flash/openocd-server 启动（自动挑支持 MSPM0 的版本）。
source [find interface/cmsis-dap.cfg]

transport select swd

# MSPM0 推荐 1~4 MHz
adapter speed 50000

set _mspm0_target [file join [file dirname [info script]] mspm0.cfg]
if { ![file exists $_mspm0_target] } {
    echo "ERROR: 找不到 $_mspm0_target"
    shutdown
}
source $_mspm0_target
